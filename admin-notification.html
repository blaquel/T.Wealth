/* =========================================================

function escapeHTML(value){

return String(value ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


function timestampMs(value){

if(!value) return null;

if(typeof value.toMillis === "function")
return value.toMillis();

if(value.seconds != null)
return Number(value.seconds) * 1000;

if(value instanceof Date)
return value.getTime();

if(typeof value === "number")
return value;

return null;

}


function formatTime(value){

const ms = timestampMs(value);

if(!ms) return "";

const date = new Date(ms);

return date.toLocaleString([],{

month:"short",

day:"numeric",

hour:"2-digit",

minute:"2-digit"

});

}


function initials(name){

const parts =
String(name || "User")
.trim()
.split(/\s+/)
.filter(Boolean);

if(!parts.length)
return "U";

return parts
.slice(0,2)
.map(x => x[0])
.join("")
.toUpperCase();

}


function showLoading(text="Processing..."){

document.getElementById("loadingText").textContent = text;

loading.classList.add("show");

function hideLoading(){

loading.classList.remove("show");

function showToast(title,message){

document.getElementById("toastTitle").textContent = title;

document.getElementById("toastMessage").textContent = message;

const toast = document.getElementById("toast");

toast.classList.add("show");

clearTimeout(toastTimer);

toastTimer = setTimeout(()=>{

toast.classList.remove("show");

},3500);

}

      └── USER_UID
           uid: USER_UID
           lastMessage: "Hello"
           lastMessageAt: timestamp
           unreadForAdmin: 1
*/

const snap =
await getDocs(
collection(db,"support_chats")
);

conversations = [];

for(const chatDoc of snap.docs){

const chatData = chatDoc.data();

const uid =
chatData.uid || chatDoc.id;

let userData = {};

try{

const userSnap =
await getDoc(
doc(db,"users",uid)
);

if(userSnap.exists()){

userData = userSnap.data();

}

}catch(_){}


conversations.push({

id:chatDoc.id,

uid,

...chatData,

fullname:
chatData.fullname ||
userData.fullname ||
"User",

email:
chatData.email ||
userData.email ||
"",

lastMessage:
chatData.lastMessage ||
"Start a conversation",

lastMessageAt:
chatData.lastMessageAt ||
chatData.updatedAt ||
chatData.createdAt ||
null,

unread:
Number(chatData.unreadForAdmin || 0)

});

}

sortConversations();

renderConversations();

}catch(error){

console.error(error);

conversationsEl.innerHTML = `

<div class="sidebar-empty">

<i class="bi bi-exclamation-triangle"></i>

<p>
Unable to load conversations.
</p>

</div>

`;

}

}


/* =========================================================
   SORT
========================================================= */

function sortConversations(){

conversations.sort((a,b)=>{

const aa =
timestampMs(a.lastMessageAt) || 0;

const bb =
timestampMs(b.lastMessageAt) || 0;

return bb-aa;

});

}


/* =========================================================
   RENDER CONVERSATIONS
========================================================= */

function renderConversations(){

const search =
searchInput.value
.trim()
.toLowerCase();


const filtered =
conversations.filter(item => {

const name =
String(item.fullname || "").toLowerCase();

const email =
String(item.email || "").toLowerCase();

const preview =
String(item.lastMessage || "").toLowerCase();

return (
name.includes(search) ||
email.includes(search) ||
preview.includes(search)
);

});


conversationCount.textContent =
conversations.length;


if(!filtered.length){

conversationsEl.innerHTML = `

<div class="sidebar-empty">

<i class="bi bi-chat-left"></i>

<p>
No support conversations found.
</p>

</div>

`;

return;

}


conversationsEl.innerHTML =
filtered.map(item=>{

const selected =
selectedUser &&
selectedUser.uid === item.uid
? "selected"
: "";

const unread =
item.unread > 0
? `<span class="unread">${item.unread}</span>`
: "";


return `

<div
class="conversation ${selected}"
data-uid="${escapeHTML(item.uid)}">

<div class="avatar">

${escapeHTML(initials(item.fullname))}

</div>

<div class="conversation-info">

<div class="conversation-top">

<div class="conversation-name">

${escapeHTML(item.fullname)}

</div>

<div class="conversation-time">

${escapeHTML(formatTime(item.lastMessageAt))}

</div>

</div>

<div class="conversation-bottom">

<div class="conversation-preview">

${escapeHTML(item.lastMessage || "No messages yet")}

</div>

${unread}

</div>

</div>

</div>

`;

}).join("");


document
.querySelectorAll(".conversation")
.forEach(el=>{

el.onclick = () => {

openConversation(el.dataset.uid);

};

});

}


/* =========================================================
   OPEN CONVERSATION
========================================================= */

async function openConversation(uid){

const conversation =
conversations.find(x => x.uid === uid);

if(!conversation)
return;


selectedUser = conversation;


/* Mobile */

chatPanel.classList.add("mobile-open");


/* Show chat */

chatEmpty.style.display = "none";

chatContent.style.display = "flex";


document.getElementById("chatAvatar").textContent =
initials(conversation.fullname);

document.getElementById("chatUserName").textContent =
conversation.fullname;

document.getElementById("chatUserEmail").textContent =
conversation.email || "No email";


replyInput.value = "";

sendBtn.disabled = true;


/* Mark admin unread count as zero */

try{

await updateDoc(
doc(db,"support_chats",uid),
{
unreadForAdmin:0
}
);

conversation.unread = 0;

}catch(error){

console.log(
"Could not update unread count:",
error
);

}


renderConversations();

listenToMessages(uid);

}


/* =========================================================
   REAL-TIME MESSAGES
========================================================= */

function listenToMessages(uid){

if(unsubscribeMessages){

unsubscribeMessages();

unsubscribeMessages = null;

}


messagesEl.innerHTML = `

<div class="chat-empty">

<div class="chat-empty-inner">

<i class="bi bi-hourglass-split"></i>

<p>Loading messages...</p>

</div>

</div>

`;


const messagesRef =
collection(
db,
"support_chats",
uid,
"messages"
);


const messagesQuery =
query(
messagesRef,
orderBy("createdAt","asc")
);


unsubscribeMessages =
onSnapshot(
messagesQuery,
snapshot=>{

if(snapshot.empty){

messagesEl.innerHTML = `

<div class="chat-empty">

<div class="chat-empty-inner">

<i class="bi bi-chat"></i>

<h3>No messages yet</h3>

<p>
Send the first reply to begin the conversation.
</p>

</div>

</div>

`;

return;

}


messagesEl.innerHTML =
snapshot.docs.map(docSnap=>{

const msg =
docSnap.data();

const isAdmin =
msg.senderType === "admin" ||
msg.role === "admin";


const messageClass =
isAdmin
? "admin"
: "user";


const senderName =
isAdmin
? "You"
: selectedUser.fullname;


return `

<div class="message-row ${messageClass}">

<div class="message ${messageClass}">

<div class="message-label">

${escapeHTML(senderName)}

</div>

${escapeHTML(msg.text || msg.message || "")}

<div class="message-meta">

${escapeHTML(formatTime(msg.createdAt))}

</div>

</div>

</div>

`;

}).join("");


messagesEl.scrollTop =
messagesEl.scrollHeight;

},
error=>{

console.error(
"Message listener error:",
error
);

messagesEl.innerHTML = `

<div class="chat-empty">

<div class="chat-empty-inner">

<i class="bi bi-exclamation-triangle"></i>

<p>
Unable to load this conversation.
</p>

</div>

</div>

`;

});

}


/* =========================================================
   SEND ADMIN MESSAGE
========================================================= */

async function sendMessage(){

if(!adminUser)
return;

if(!selectedUser)
return;


const text =
replyInput.value.trim();

if(!text)
return;


sendBtn.disabled = true;

showLoading("Sending reply...");


try{

const uid =
selectedUser.uid;


/* Add message */

await addDoc(

collection(
db,
"support_chats",
uid,
"messages"
),

{

text,

senderType:"admin",

role:"admin",

senderUid:adminUser.uid,

senderName:
adminUser.email || "T.Wealth Support",

createdAt:
serverTimestamp(),

read:false

}

);


/* Update conversation */

await updateDoc(

doc(
db,
"support_chats",
uid
),

{

lastMessage:text,

lastMessageAt:
serverTimestamp(),

unreadForUser:
1

}

);


/*
   Also create a notification for the user.
*/

await addDoc(

collection(db,"notifications"),

{

uid,

title:"New Support Message",

message:text,

type:"support",

read:false,

createdAt:
serverTimestamp(),

sender:"T.Wealth Support"

}

);


replyInput.value = "";

showToast(
"Message sent",
"Your reply has been delivered to the user."
);


}catch(error){

console.error(error);

showToast(
"Message failed",
error.message || "Unable to send the message."
);

}finally{

hideLoading();

sendBtn.disabled =
!replyInput.value.trim();

}

}


/* =========================================================
   SEND NOTIFICATION
========================================================= */

async function sendNotification(){

if(!selectedUser)
return;


const title =
document.getElementById("notificationTitle")
.value.trim();

const message =
document.getElementById("notificationMessage")
.value.trim();


if(!title){

showToast(
"Missing title",
"Please enter a notification title."
);

return;

}


if(!message){

showToast(
"Missing message",
"Please enter a notification message."
);

return;

}


showLoading("Sending notification...");


try{

await addDoc(

collection(db,"notifications"),

{

uid:selectedUser.uid,

title,

message,

type:"admin",

read:false,

createdAt:
serverTimestamp(),

sender:"T.Wealth Admin"

}

);


document.getElementById("notificationTitle").value = "";

document.getElementById("notificationMessage").value = "";

notificationPanel.classList.remove("show");


showToast(
"Notification sent",
"The user has been notified successfully."
);


}catch(error){

console.error(error);

showToast(
"Notification failed",
error.message || "Unable to send notification."
);

}finally{

hideLoading();

}

}


/* =========================================================
   EVENTS
========================================================= */

searchInput.addEventListener(
"input",
renderConversations
);


replyInput.addEventListener(
"input",
()=>{

sendBtn.disabled =
!replyInput.value.trim();

}
);


replyInput.addEventListener(
"keydown",
event=>{

if(
event.key === "Enter" &&
!event.shiftKey
){

event.preventDefault();

sendMessage();

}

}
);


sendBtn.onclick =
sendMessage;


document.getElementById(
"notificationBtn"
).onclick = ()=>{

if(!selectedUser)
return;

document.getElementById(
"notificationRecipient"
).value =
selectedUser.fullname;

notificationPanel.classList.add("show");

};


document.getElementById(
"closeNotification"
).onclick = ()=>{

notificationPanel.classList.remove("show");

};


notificationPanel.addEventListener(
"click",
event=>{

if(event.target === notificationPanel){

notificationPanel.classList.remove("show");

}

}
);


document.getElementById(
"mobileBack"
).onclick = ()=>{

chatPanel.classList.remove("mobile-open");

};


document.getElementById(
"backBtn"
).onclick = ()=>{

location.href =
"admin.html";

};


document.getElementById(
"sendNotification"
).onclick =
sendNotification;


onAuthStateChanged(auth, async user => {

    if (!user) {
        location.href = "login.html";
        return;
    }

    adminUser = user;

    await loadConversations();

});


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
"beforeunload",
()=>{

if(unsubscribeMessages)
unsubscribeMessages();

if(unsubscribeConversations)
unsubscribeConversations();

}
);

</script>

</body>
</html>
