<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>T.Wealth | Support Chat</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
background:#050505;
font-family:Poppins,sans-serif;
color:#fff;
height:100vh;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* HEADER */

.header{

height:78px;

display:flex;

align-items:center;

gap:14px;

padding:0 18px;

background:#111;

border-bottom:1px solid rgba(212,175,55,.15);

flex-shrink:0;

}

.back{

width:44px;

height:44px;

border-radius:50%;

background:#1b1b1b;

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

font-size:20px;

color:#FFD54A;

transition:.3s;

}

.back:hover{

background:#FFD54A;

color:#111;

}

.admin-avatar{

width:48px;

height:48px;

border-radius:50%;

background:linear-gradient(135deg,#FFD54A,#c79200);

display:flex;

align-items:center;

justify-content:center;

font-size:22px;

color:#111;

}

.header-info{

display:flex;

flex-direction:column;

}

.header-info h3{

font-size:18px;

font-weight:700;

color:#FFD54A;

}

.header-info p{

font-size:13px;

color:#00ff88;

}

/* CHAT */

.messages{

flex:1;

overflow-y:auto;

padding:18px;

display:flex;

flex-direction:column;

gap:16px;

scroll-behavior:smooth;

}

/* USER */

.message.user{

align-self:flex-end;

max-width:80%;

background:#FFD54A;

color:#111;

padding:14px 16px;

border-radius:18px 18px 6px 18px;

font-size:15px;

line-height:1.6;

font-weight:500;

box-shadow:0 10px 25px rgba(0,0,0,.25);

}

/* ADMIN */

.message.admin{

align-self:flex-start;

max-width:80%;

background:#141414;

border:1px solid rgba(212,175,55,.18);

padding:14px 16px;

border-radius:18px 18px 18px 6px;

font-size:15px;

line-height:1.6;

box-shadow:0 10px 25px rgba(0,0,0,.25);

}

.time{

margin-top:8px;

font-size:11px;

opacity:.7;

}

/* WELCOME */

.welcome{

margin:auto;

text-align:center;

color:#888;

padding:30px;

}

.welcome i{

font-size:70px;

color:#FFD54A;

margin-bottom:18px;

display:block;

}

.welcome h2{

color:#FFD54A;

margin-bottom:12px;

font-size:24px;

}

.welcome p{

line-height:1.8;

}

/* INPUT */

.input-area{

display:flex;

gap:12px;

padding:16px;

background:#111;

border-top:1px solid rgba(212,175,55,.15);

flex-shrink:0;

}

.input-area input{

flex:1;

height:54px;

background:#1a1a1a;

border:1px solid rgba(212,175,55,.15);

border-radius:30px;

padding:0 18px;

color:#fff;

font-size:15px;

outline:none;

}

.input-area input:focus{

border-color:#FFD54A;

}

.input-area button{

width:56px;

height:56px;

border:none;

border-radius:50%;

background:#FFD54A;

color:#111;

font-size:22px;

cursor:pointer;

transition:.3s;

}

.input-area button:hover{

transform:scale(1.05);

}

</style>

</head>

<body>

<div class="header">

<div class="back"
onclick="window.location.href='support.html'">

<i class="bi bi-arrow-left"></i>

</div>

<div class="admin-avatar">

<i class="bi bi-headset"></i>

</div>

<div class="header-info">

<h3>T.Wealth Support</h3>

<p>Online</p>

</div>

</div>

<div
id="messages"
class="messages">

<div class="welcome">

<i class="bi bi-chat-heart-fill"></i>

<h2>Welcome to T.Wealth</h2>

<p>

Our support team is ready to assist you.<br>

Send us a message and you'll receive a reply shortly.

</p>

</div>

</div>

<div class="input-area">

<input
id="messageInput"
type="text"
placeholder="Type your message...">

<button
id="sendBtn">

<i class="bi bi-send-fill"></i>

</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
updateDoc,
collection,
addDoc,
query,
where,
limit,
getDocs,
orderBy,
onSnapshot,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

/*=========================
FIREBASE
=========================*/

const firebaseConfig={

apiKey:"AIzaSyCfmUdXAvdktAZ7RRFYGq5R2ZMgFQjBIHg",

authDomain:"t-wealth-6c492.firebaseapp.com",

projectId:"t-wealth-6c492",

storageBucket:"t-wealth-6c492.firebasestorage.app",

messagingSenderId:"920631507931",

appId:"1:920631507931:web:ec6769afe5feebfed0c5fe"

};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);

/*=========================
ELEMENTS
=========================*/

const messages=document.getElementById("messages");

const input=document.getElementById("messageInput");

const sendBtn=document.getElementById("sendBtn");

let chatId=null;

/*=========================
LOGIN
=========================*/

onAuthStateChanged(auth,async(user)=>{

if(!user){

location.href="login.html";

return;

}

const userSnap=await getDoc(doc(db,"users",user.uid));

if(!userSnap.exists()) return;

const userData=userSnap.data();

/* Find existing chat */

const q=query(

collection(db,"support_chats"),

where("userId","==",user.uid),

limit(1)

);

const result=await getDocs(q);

if(result.empty){

chatId=user.uid;

await setDoc(

doc(db,"support_chats",chatId),

{

userId:user.uid,

fullname:userData.fullname||"",

username:userData.username||"",

email:userData.email||"",

lastMessage:"",

updatedAt:serverTimestamp(),

unreadForAdmin:false,

unreadForUser:false

}

);

}else{

chatId=result.docs[0].id;

}

listenMessages();

});

/*=========================
REALTIME CHAT
=========================*/

function listenMessages(){

const q=query(

collection(db,"support_chats",chatId,"messages"),

orderBy("createdAt","asc")

);

onSnapshot(q,(snapshot)=>{

messages.innerHTML="";

if(snapshot.empty){

messages.innerHTML=`

<div class="welcome">

<i class="bi bi-chat-heart-fill"></i>

<h2>Welcome to T.Wealth</h2>

<p>

Our support team is ready to assist you.<br>

Send us a message and we'll reply shortly.

</p>

</div>

`;

return;

}

snapshot.forEach(docSnap=>{

const data=docSnap.data();

const time=data.createdAt

?data.createdAt.toDate().toLocaleTimeString([],{

hour:"2-digit",

minute:"2-digit"

})

:"";

messages.innerHTML+=`

<div class="message ${data.sender}">

${data.text}

<div class="time">

${time}

</div>

</div>

`;

});

updateDoc(

doc(db,"support_chats",chatId),

{

unreadForUser:false

}

);

messages.scrollTop=messages.scrollHeight;

});

}

/*=========================
SEND MESSAGE
=========================*/

sendBtn.onclick=async()=>{

const text=input.value.trim();

if(text==="") return;

await addDoc(

collection(db,"support_chats",chatId,"messages"),

{

sender:"user",

text:text,

createdAt:serverTimestamp()

}

);

await updateDoc(

doc(db,"support_chats",chatId),

{

lastMessage:"",
lastTime:serverTimestamp(),
unreadForAdmin:false,
unreadForUser:false

}

);

input.value="";

};

input.addEventListener("keypress",(e)=>{

if(e.key==="Enter"){

sendBtn.click();

}

});

</script>

</body>

</html>
