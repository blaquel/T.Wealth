<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta
name="theme-color"
content="#080808">

<meta
name="apple-mobile-web-app-capable"
content="yes">

<meta
name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<title>T.Wealth | Login</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

/* ==========================
RESET
========================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
-webkit-tap-highlight-color:transparent;
}

html{
scroll-behavior:smooth;
touch-action:manipulation;
}

body{
background:#080808;
color:#fff;
overflow-x:hidden;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:25px 15px;
position:relative;
}

/* ==========================
ANIMATED BACKGROUND
========================== */

.bg-gradient{
position:fixed;
border-radius:50%;
filter:blur(130px);
z-index:-1;
animation:floatGlow 10s ease-in-out infinite;
}

.bg1{
width:380px;
height:380px;
background:#D4AF37;
top:-180px;
left:-180px;
opacity:.10;
}

.bg2{
width:320px;
height:320px;
background:#FFD54A;
bottom:-150px;
right:-150px;
opacity:.08;
animation-delay:4s;
}

@keyframes floatGlow{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(30px);
}

}

/* ==========================
LOGIN CARD
========================== */

.login-card{

width:100%;
max-width:470px;
background:#121212;
border:1px solid rgba(212,175,55,.18);
border-radius:28px;
padding:35px 28px;
box-shadow:
0 20px 50px rgba(0,0,0,.55),
0 0 35px rgba(212,175,55,.08);
animation:cardIn .6s ease;

}

@keyframes cardIn{

from{

opacity:0;
transform:translateY(40px);

}

to{

opacity:1;
transform:translateY(0);

}

}

/* ==========================
LOGO
========================== */

.logo-area{

text-align:center;
margin-bottom:30px;

}

.logo{

width:90px;
height:90px;
object-fit:contain;
margin-bottom:15px;
animation:logoFloat 3s ease-in-out infinite;

}

@keyframes logoFloat{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-6px);
}

}

.logo-area h1{

font-size:30px;
font-weight:700;
color:#D4AF37;

}

.logo-area p{

margin-top:8px;
font-size:14px;
color:#999;
line-height:1.6;

}

/* ==========================
FORM
========================== */

.input-group{
margin-bottom:18px;
}

.input-group label{
display:block;
margin-bottom:8px;
font-size:14px;
font-weight:500;
color:#ddd;
}

.input-group input{
width:100%;
height:58px;
padding:0 18px;
border:none;
outline:none;
border-radius:16px;
background:#1b1b1b;
border:1px solid #2d2d2d;
color:#fff;
font-size:15px;
transition:.3s;
}

.input-group input::placeholder{
color:#777;
}

.input-group input:focus{
border-color:#D4AF37;
box-shadow:0 0 18px rgba(212,175,55,.18);
}

/* ==========================
PASSWORD
========================== */

.password-box{
position:relative;
}

.password-box input{
padding-right:85px;
}

.toggle-password{
position:absolute;
right:14px;
top:50%;
transform:translateY(-50%);
border:none;
background:none;
color:#D4AF37;
font-size:14px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.toggle-password:hover{
color:#FFD54A;
}

/* ==========================
REMEMBER ME
========================== */

.remember-row{
display:flex;
justify-content:space-between;
align-items:center;
margin:20px 0 25px;
gap:10px;
flex-wrap:wrap;
}

.remember-box{
display:flex;
align-items:center;
gap:10px;
}

.remember-box input{
width:18px;
height:18px;
accent-color:#D4AF37;
}

.remember-box label{
font-size:14px;
color:#bbb;
cursor:pointer;
}

/* ==========================
FORGOT PASSWORD
========================== */

.forgot-link{
font-size:14px;
color:#D4AF37;
text-decoration:none;
font-weight:600;
transition:.3s;
}

.forgot-link:hover{
color:#FFD54A;
text-decoration:underline;
}

/* ==========================
LOGIN BUTTON
========================== */

.login-btn{
width:100%;
height:58px;
border:none;
border-radius:50px;
background:linear-gradient(135deg,#FFD54A,#C99A06);
color:#111;
font-size:16px;
font-weight:700;
cursor:pointer;
transition:.35s;
}

.login-btn:hover{
transform:translateY(-3px);
box-shadow:0 15px 35px rgba(212,175,55,.35);
}

.login-btn:active{
transform:scale(.98);
}

/* ==========================
BOTTOM LINK
========================== */

.bottom-text{
margin-top:25px;
text-align:center;
font-size:15px;
color:#999;
}

.bottom-text a{
color:#D4AF37;
font-weight:600;
text-decoration:none;
transition:.3s;
}

.bottom-text a:hover{
color:#FFD54A;
}

/* ==========================
PREMIUM LOADING OVERLAY
========================== */

.loading-overlay{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.96);
    backdrop-filter:blur(15px);
    z-index:999999;
}

.loading-box{
    position:relative;
    text-align:center;
}

.logo-ring{

    position:absolute;
    width:150px;
    height:150px;

    border-radius:50%;

    border:4px solid rgba(212,175,55,.15);

    border-top:4px solid #FFD54A;

    left:50%;
    top:18px;

    transform:translateX(-50%);

    animation:ringSpin 1.2s linear infinite;

}

.loading-logo{

    width:100px;
    height:100px;

    object-fit:contain;

    position:relative;

    z-index:2;

    animation:logoPulse 1.5s ease-in-out infinite;

    filter:
    drop-shadow(0 0 10px gold)
    drop-shadow(0 0 30px rgba(255,215,0,.8));

}

.loading-box h2{

    margin-top:40px;

    color:#FFD54A;

    font-size:26px;

    font-weight:700;

}

.loading-box p{

    margin-top:10px;

    color:#cccccc;

    font-size:15px;

    line-height:1.8;

}

.loading-dots{

    display:flex;

    justify-content:center;

    gap:8px;

    margin-top:28px;

}

.loading-dots span{

    width:10px;

    height:10px;

    border-radius:50%;

    background:#FFD54A;

    animation:dots 1.2s infinite;

}

.loading-dots span:nth-child(2){

    animation-delay:.2s;

}

.loading-dots span:nth-child(3){

    animation-delay:.4s;

}

@keyframes ringSpin{

    from{

        transform:translateX(-50%) rotate(0deg);

    }

    to{

        transform:translateX(-50%) rotate(360deg);

    }

}

@keyframes logoPulse{

    0%,100%{

        transform:scale(1);

    }

    50%{

        transform:scale(1.08);

    }

}

@keyframes dots{

    0%,100%{

        opacity:.3;

        transform:translateY(0);

    }

    50%{

        opacity:1;

        transform:translateY(-10px);

    }

}

/* ==========================
PREMIUM ALERT
========================== */

.alert-overlay{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.88);
backdrop-filter:blur(10px);
z-index:100000;
}

.alert-card{
width:90%;
max-width:360px;
background:#151515;
border:1px solid rgba(212,175,55,.25);
border-radius:24px;
padding:35px 28px;
text-align:center;
animation:alertIn .35s ease;
}

@keyframes alertIn{

from{
opacity:0;
transform:scale(.85);
}

to{
opacity:1;
transform:scale(1);
}

}

.alert-icon{
width:78px;
height:78px;
margin:0 auto 20px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#FFD54A,#C99A06);
color:#111;
font-size:34px;
font-weight:700;
}

.alert-card h2{
font-size:24px;
margin-bottom:12px;
color:#fff;
}

.alert-card p{
font-size:15px;
line-height:1.8;
color:#bcbcbc;
}

.alert-card button{
margin-top:25px;
width:100%;
height:52px;
border:none;
border-radius:50px;
background:linear-gradient(135deg,#FFD54A,#C99A06);
color:#111;
font-size:15px;
font-weight:700;
cursor:pointer;
transition:.3s;
}

.alert-card button:hover{
transform:translateY(-2px);
}

/* ==========================
RESPONSIVE
========================== */

@media(max-width:600px){

.login-card{
padding:28px 22px;
}

.logo{
width:75px;
height:75px;
}

.logo-area h1{
font-size:26px;
}

.remember-row{
flex-direction:column;
align-items:flex-start;
gap:15px;
}

.forgot-link{
align-self:flex-end;
}

}

</style>

</head>

<body>

<!-- ==========================
Animated Background
========================== -->

<div class="bg-gradient bg1"></div>

<div class="bg-gradient bg2"></div>

<!-- ==========================
Login Card
========================== -->

<div class="login-card">

<!-- Logo -->

<div class="logo-area">

<img
src="logo.png"
alt="T.Wealth Logo"
class="logo">

<h1>T.Wealth</h1>

<p>

Secure Wealth. Smarter Investing.

</p>

</div>

<!-- ==========================
Login Form
========================== -->

<form
id="loginForm"
autocomplete="off">

<!-- Email -->

<div class="input-group">

<label>

Email Address

</label>

<input
type="email"
id="email"
placeholder="Enter your email address"
autocomplete="email"
required>

</div>

<!-- Password -->

<div class="input-group">

<label>

Password

</label>

<div class="password-box">

<input
type="password"
id="password"
placeholder="Enter your password"
autocomplete="current-password"
required>

<button
type="button"
class="toggle-password"
data-target="password">

Show

</button>

</div>

</div>

<!-- Remember Me / Forgot Password -->

<div class="remember-row">

<div class="remember-box">

<input
type="checkbox"
id="rememberMe">

<label for="rememberMe">

Remember Me

</label>

</div>

<a
href="#"
id="forgotPassword"
class="forgot-link">

Forgot Password?

</a>

</div>

<!-- Login Button -->

<button
type="submit"
class="login-btn">

Login

</button>

</form>

<!-- Bottom Link -->

<div class="bottom-text">

Don't have an account?

<a href="register.html">

Create Account

</a>

</div>

</div>

<!-- ==========================
LOADING OVERLAY
========================== -->

<div class="loading-overlay" id="loadingOverlay">

    <div class="loading-box">

        <div class="logo-ring"></div>

        <img
            src="logo.png"
            class="loading-logo"
            alt="Tesla">

        <h2 id="loadingTitle">
            Please Wait...
        </h2>

        <p id="loadingText">
            Securing your request...
        </p>

        <div class="loading-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>

</div>

</div>

<!-- ==========================
PREMIUM ALERT
========================== -->

<div
class="alert-overlay"
id="alertOverlay">

<div class="alert-card">

<div
class="alert-icon"
id="alertIcon">

✓

</div>

<h2
id="alertTitle">

Success

</h2>

<p
id="alertMessage">

Operation completed successfully.

</p>

<button
type="button"
id="alertButton">

Continue

</button>

</div>

</div>

<!-- ==========================
FIREBASE JAVASCRIPT
PART 2
========================== -->

<script type="module">

/* ==========================
FIREBASE IMPORTS
========================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
setPersistence,
browserLocalPersistence,
browserSessionPersistence,
sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

import {
getFirestore
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

/* ==========================
FIREBASE CONFIG
========================== */

const firebaseConfig={

apiKey:"AIzaSyCfmUdXAvdktAZ7RRFYGq5R2ZMgFQjBIHg",

authDomain:"t-wealth-6c492.firebaseapp.com",

projectId:"t-wealth-6c492",

storageBucket:"t-wealth-6c492.firebasestorage.app",

messagingSenderId:"920631507931",

appId:"1:920631507931:web:ec6769afe5feebfed0c5fe"

};

/* ==========================
INITIALIZE FIREBASE
========================== */

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);

/* ==========================
ELEMENTS
========================== */

const loginForm=document.getElementById("loginForm");

const email=document.getElementById("email");

const password=document.getElementById("password");

const rememberMe=document.getElementById("rememberMe");

const forgotPassword=document.getElementById("forgotPassword");

const loadingOverlay=document.getElementById("loadingOverlay");

const alertOverlay=document.getElementById("alertOverlay");

const alertIcon=document.getElementById("alertIcon");

const alertTitle=document.getElementById("alertTitle");

const alertMessage=document.getElementById("alertMessage");

const alertButton=document.getElementById("alertButton");

/* ==========================
SHOW / HIDE PASSWORD
========================== */

document.querySelectorAll(".toggle-password").forEach(button=>{

button.addEventListener("click",()=>{

const input=document.getElementById(button.dataset.target);

if(!input) return;

if(input.type==="password"){

input.type="text";

button.textContent="Hide";

}else{

input.type="password";

button.textContent="Show";

}

});

});

/* ==========================
LOADING OVERLAY
========================== */

function showLoading(){

loadingOverlay.style.display="flex";

}

function hideLoading(){

loadingOverlay.style.display="none";

}

/* ==========================
PREMIUM ALERT
========================== */

function showAlert(type,title,message){

hideLoading();

alertOverlay.style.display="flex";

alertTitle.textContent=title;

alertMessage.textContent=message;

switch(type){

case "success":

alertIcon.innerHTML="✓";

alertIcon.style.background="linear-gradient(135deg,#FFD54A,#C99A06)";

break;

case "warning":

alertIcon.innerHTML="!";

alertIcon.style.background="#D4AF37";

break;

case "error":

alertIcon.innerHTML="✕";

alertIcon.style.background="#D32F2F";

break;

default:

alertIcon.innerHTML="i";

alertIcon.style.background="#D4AF37";

}

}

alertButton.addEventListener("click",()=>{

alertOverlay.style.display="none";

});

/* ==========================
REMEMBER ME
========================== */

/* ==========================
REMEMBER ME
========================== */

async function applyPersistence() {

    if (rememberMe.checked) {

        await setPersistence(auth, browserLocalPersistence);

    } else {

        await setPersistence(auth, browserLocalPersistence);

    }

}

/* ==========================
FORGOT PASSWORD
========================== */

forgotPassword.addEventListener("click",async(e)=>{

e.preventDefault();

const emailValue=email.value.trim();

if(emailValue===""){

showAlert(

"warning",

"Email Required",

"Please enter your email address first."

);

return;

}

try{

showLoading();

await sendPasswordResetEmail(auth,emailValue);

showAlert(

"success",

"Reset Email Sent",

"Check your inbox for password reset instructions."

);

}catch(error){

showAlert(

"error",

"Reset Failed",

error.message

);

}

});

/* ==========================
PART 2B STARTS HERE
========================== */

/* ==========================
LOGIN
PART 2B-1
========================== */

loginForm.addEventListener("submit",async(e)=>{

e.preventDefault();

const emailValue=email.value.trim();

const passwordValue=password.value;

/* Email Validation */

if(emailValue===""){

showAlert(
"warning",
"Email Required",
"Please enter your email address."
);

return;

}

/* Password Validation */

if(passwordValue===""){

showAlert(
"warning",
"Password Required",
"Please enter your password."
);

return;

}

if(passwordValue.length<6){

showAlert(
"warning",
"Invalid Password",
"Password must contain at least 6 characters."
);

return;

}

/* Loading */

showLoading();

try{

/* Remember Me */

await applyPersistence();

/* Firebase Login */

const userCredential=

await signInWithEmailAndPassword(

auth,

emailValue,

passwordValue

);

const user=userCredential.user;

console.log("Logged in:",user.uid);

hideLoading();

showAlert(
    "success",
    "Login Successful",
    "Welcome back to T.Wealth."
);

alertButton.onclick = function () {
    alertOverlay.style.display = "none";
    window.location.href = "dashboard.html";
};

return;

/* Continue in Part 2B-2 */

}catch(error){

hideLoading();

let title="Login Failed";

let message="Unable to sign in. Please try again.";

switch(error.code){

case "auth/invalid-email":

message="Please enter a valid email address.";

break;

case "auth/invalid-credential":

message="Incorrect email or password.";

break;

case "auth/user-not-found":

message="No account was found with this email.";

break;

case "auth/wrong-password":

message="Incorrect password.";

break;

case "auth/too-many-requests":

message="Too many login attempts. Please try again later.";

break;

case "auth/network-request-failed":

message="Network error. Check your internet connection.";

break;

default:

message=error.message;

}

showAlert(

"error",

title,

message

);

}

});

</script>

</body>

</html>
